# [INPUT]: 依赖 v* Git 标签、package.json 版本、npm 构建脚本与 Trusted Publisher 配置
# [OUTPUT]: 在 GitHub-hosted runner 上以短期 OIDC 身份发布 npm 包及来源证明
# [POS]: npm 唯一自动发布入口，不保存长期 npm token
# [PROTOCOL]: 变更时更新此头部，然后检查 AGENTS.md
name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - name: Verify tag matches package version
        run: node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; if (process.env.GITHUB_REF_NAME !== 'v' + pkg.version) process.exit(1)"
      - run: npm publish
